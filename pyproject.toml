[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-maker"
version = "0.1.0"
description = "Does a small maker earn the retail-flow premium on Kalshi? Tape backtest and forward paper maker."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=15,<26",
    "duckdb>=1.5,<1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
kmaker = "kmaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
